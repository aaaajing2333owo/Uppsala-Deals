<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uppsala Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 flex justify-center">

    <div class="w-full max-w-md bg-[#F4F1EA] min-h-screen relative shadow-2xl overflow-hidden flex flex-col pb-24">
        <!-- 主页视图 -->
        <div id="home-view" class="block flex-1 overflow-y-auto">
            <header class="bg-[#8A151B] text-white pt-10 pb-3 px-4 sticky top-0 z-50 shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <h1 class="text-[17px] font-black tracking-tight font-sans">UPPSALA DEALS</h1>
                    <div class="flex bg-black/20 rounded-full p-0.5 text-[10px]">
                        <button class="px-2 py-1 bg-white text-[#8A151B] rounded-full font-bold shadow-sm">本周</button>
                        <button class="px-2 py-1 text-white/80 rounded-full font-medium">下周</button>
                    </div>
                </div>
            </header>

            <main class="px-4 mt-4 space-y-5">
                <section>
                    <div class="flex justify-between items-end mb-3">
                        <h2 class="text-[15px] font-black text-gray-900 tracking-wide">本周精选折扣</h2>
                    </div>
                    <!-- 卡片容器 -->
                    <div id="home-products-container" class="grid grid-cols-2 gap-2">
                        <div class="text-[12px] text-gray-500 py-4 col-span-2">正在获取最新折扣...</div>
                    </div>
                    
                    <button onclick="toggleView('all-items-view')" class="w-full mt-3 py-2.5 border border-[#8A151B] text-[#8A151B] font-bold text-[12px] rounded-xl flex items-center justify-center space-x-1 bg-white shadow-sm active:bg-[#8A151B] active:text-white transition-colors">
                        <span>浏览全部打折商品</span>
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </section>
            </main>
        </div>

        <!-- 全量视图 -->
        <div id="all-items-view" class="hidden flex-1 flex flex-col h-full bg-[#F4F1EA]">
            <header class="bg-[#8A151B] text-white pt-10 pb-0 px-4 sticky top-0 z-50 shadow-md flex-shrink-0">
                <div class="flex items-center space-x-2 mb-3">
                    <button onclick="toggleView('home-view')" class="text-white p-1 -ml-1 active:bg-white/10 rounded-full transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h1 class="text-[17px] font-black tracking-tight font-sans flex-1">全部折扣</h1>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto px-3 pt-2">
                <div class="flex overflow-x-auto no-scrollbar space-x-2 py-1 mb-1">
                    <button id="filter-all" onclick="toggleStoreFilter('all')" class="px-3 py-1 bg-[#8A151B] text-white text-[11px] font-bold rounded-full flex-shrink-0 shadow-sm transition-colors">全部</button>
                    <button id="filter-ICA" onclick="toggleStoreFilter('ICA')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">ICA</button>
                    <button id="filter-HEMKÖP" onclick="toggleStoreFilter('HEMKÖP')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">HEMKÖP</button>
                    <button id="filter-WILLYS" onclick="toggleStoreFilter('WILLYS')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">WILLYS</button>
                </div>
                <div id="all-products-container" class="grid grid-cols-2 gap-2 pb-8 mt-2"></div>
                <div id="empty-state" class="hidden text-center text-gray-400 text-[12px] py-10">此选择下暂无打折商品</div>
            </main>
        </div>
    </div>

    <script>
        let products = [];
        let selectedStores = new Set();

        // 加入动态时间戳 ?t=xxx 强制绕过缓存拉取最新数据
        fetch('data.json?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error('网络请求报错');
                return response.json();
            })
            .then(data => {
                products = data;
                document.getElementById('home-products-container').innerHTML = products.slice(0, 4).map(createCardHTML).join('');
                renderAllItems();
            })
            .catch(error => {
                console.error('数据读取失败:', error);
                document.getElementById('home-products-container').innerHTML = '<div class="text-[12px] text-[#8A151B] py-4 col-span-2 font-bold">数据读取失败，请检查云端流水线</div>';
            });

        function toggleStoreFilter(storeName) {
            if (storeName === 'all') {
                selectedStores.clear();
            } else {
                selectedStores.has(storeName) ? selectedStores.delete(storeName) : selectedStores.add(storeName);
            }
            updateFilterButtonsUI();
            renderAllItems();
        }

        function updateFilterButtonsUI() {
            const active = "px-3 py-1 bg-[#8A151B] text-white text-[11px] font-bold rounded-full flex-shrink-0 shadow-sm transition-colors";
            const inactive = "px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors";
            document.getElementById('filter-all').className = selectedStores.size === 0 ? active : inactive;
            ['ICA', 'HEMKÖP', 'WILLYS'].forEach(store => {
                const btn = document.getElementById(`filter-${store}`);
                if (btn) btn.className = selectedStores.has(store) ? active : inactive;
            });
        }

        function createCardHTML(p) {
            return `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 relative pb-2 flex flex-col">
                    <div class="absolute top-1.5 right-1.5 bg-[#8A151B] text-white font-bold text-[9px] px-1 py-0.5 rounded z-10">${p.discount}</div>
                    <div class="h-24 bg-gray-100 w-full relative shrink-0">
                        <div class="absolute bottom-1.5 left-1.5 bg-white/90 backdrop-blur text-[#8A151B] font-black text-[8px] px-1 py-0.5 rounded shadow-sm">${p.store}</div>
                    </div>
                    <div class="p-2 flex flex-col justify-between flex-1">
                        <div>
                            <h3 class="text-[12px] font-bold text-gray-900 leading-tight">${p.name}</h3>
                            <p class="text-[9px] text-gray-500 mt-1">${p.specs}</p>
                        </div>
                        <div class="mt-2 flex items-end justify-between">
                            <div class="flex items-baseline space-x-1">
                                <span class="text-[#8A151B] font-black text-[15px] leading-none">${p.currentPrice}<span class="text-[9px] font-normal">kr</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAllItems() {
            let filtered = selectedStores.size > 0 ? products.filter(p => selectedStores.has(p.store)) : products;
            const container = document.getElementById('all-products-container');
            const emptyState = document.getElementById('empty-state');
            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                container.innerHTML = filtered.map(createCardHTML).join('');
            }
        }

        function toggleView(viewId) {
            const home = document.getElementById('home-view');
            const all = document.getElementById('all-items-view');
            if (viewId === 'all-items-view') {
                home.classList.replace('flex-1', 'hidden');
                all.classList.replace('hidden', 'flex-1');
            } else {
                all.classList.replace('flex-1', 'hidden');
                home.classList.replace('hidden', 'flex-1');
            }
        }
    </script>
</body>
</html>
