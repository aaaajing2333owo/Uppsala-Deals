<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uppsala Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 flex justify-center">

    <div class="w-full max-w-md bg-[#F4F1EA] min-h-screen relative shadow-2xl overflow-hidden flex flex-col pb-24">

        <!-- ================= HOME VIEW ================= -->
        <div id="home-view" class="block flex-1 overflow-y-auto">
            
            <header class="bg-[#8A151B] text-white pt-10 pb-3 px-4 sticky top-0 z-50 shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <h1 class="text-[17px] font-black tracking-tight font-sans">UPPSALA DEALS</h1>
                    <!-- 主页时间切换 -->
                    <div class="flex bg-black/20 rounded-full p-0.5 text-[10px]" id="time-toggle-home">
                        <button onclick="setWeek('this')" class="time-btn-this px-2 py-1 bg-white text-[#8A151B] rounded-full font-bold shadow-sm transition-colors">本周</button>
                        <button onclick="setWeek('next')" class="time-btn-next px-2 py-1 text-white/80 rounded-full font-medium transition-colors">下周</button>
                    </div>
                </div>
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" placeholder="搜索商品..." class="block w-full pl-9 pr-3 py-1.5 border border-transparent rounded-full leading-5 bg-white/10 text-white placeholder-white/70 focus:outline-none focus:bg-white focus:text-gray-900 text-[13px] transition-colors">
                </div>
            </header>

            <main class="px-4 mt-4 space-y-5">
                <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                    <h2 class="text-base font-black text-gray-900 mb-3 tracking-wide">本周周报</h2>
                    <div class="space-y-3 text-[13px] leading-snug text-gray-600">
                        <div><span class="font-black text-[#B8860B] block mb-0.5">特别关心监测</span>您关注的 Garant 牛绞肉本周在 Hemköp 降至 89 kr/kg，触及 30 天史低。</div>
                        <div class="h-px bg-gray-100 w-full"></div>
                        <div><span class="font-black text-[#B8860B] block mb-0.5">全城品类走势</span>受秋收季清库存影响，本地根茎类蔬菜价格大幅跳水，Willys 网袋装为全城最低。</div>
                    </div>
                </section>

                <section>
                    <div class="grid grid-cols-5 gap-2">
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">ICA</div>
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">HEMKÖP</div>
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">WILLYS</div>
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">LIDL</div>
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">COOP</div>
                    </div>
                </section>

                <section>
                    <div class="flex justify-between items-end mb-3">
                        <h2 class="text-[15px] font-black text-gray-900 tracking-wide">精选超值折扣</h2>
                        <!-- 新增：强制刷新按钮 -->
                        <button onclick="fetchData()" class="flex items-center space-x-1 text-[10px] text-[#8A151B] font-bold bg-[#8A151B]/10 px-2 py-1.5 rounded-full active:scale-95 transition-transform">
                            <svg id="refresh-icon" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span id="refresh-text">刷新数据</span>
                        </button>
                    </div>
                    
                    <div id="home-products-container" class="grid grid-cols-2 gap-2"></div>
                    <div id="home-empty-state" class="hidden text-center text-gray-400 text-[12px] py-6 bg-white rounded-xl border border-gray-100">此时间段暂无精选商品</div>

                    <button onclick="toggleView('all-items-view')" class="w-full mt-3 py-2.5 border border-[#8A151B] text-[#8A151B] font-bold text-[12px] rounded-xl flex items-center justify-center space-x-1 bg-white shadow-sm active:bg-[#8A151B] active:text-white transition-colors">
                        <span>浏览全部打折商品</span>
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </section>
            </main>
        </div>


        <!-- ================= ALL ITEMS VIEW ================= -->
        <div id="all-items-view" class="hidden flex-1 flex flex-col h-full bg-[#F4F1EA]">
            
            <header class="bg-[#8A151B] text-white pt-10 pb-0 px-4 sticky top-0 z-50 shadow-md flex-shrink-0">
                <div class="flex items-center space-x-2 mb-3">
                    <button onclick="toggleView('home-view')" class="text-white p-1 -ml-1 active:bg-white/10 rounded-full transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h1 class="text-[17px] font-black tracking-tight font-sans flex-1">全部折扣</h1>
                </div>
                
                <div class="flex overflow-x-auto no-scrollbar space-x-5 pb-2 text-[13px] font-medium">
                    <button class="text-white font-bold whitespace-nowrap border-b-2 border-white pb-1">精选</button>
                    <button class="text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">肉禽蛋</button>
                    <button class="text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">水产海鲜</button>
                    <button class="text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">时令果蔬</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto px-3 pt-2">
                
                <div class="flex overflow-x-auto no-scrollbar space-x-2 py-1 mb-1">
                    <button id="filter-all" onclick="toggleStoreFilter('all')" class="px-3 py-1 bg-[#8A151B] text-white text-[11px] font-bold rounded-full flex-shrink-0 shadow-sm transition-colors">全部</button>
                    <button id="filter-ICA" onclick="toggleStoreFilter('ICA')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">ICA</button>
                    <button id="filter-HEMKÖP" onclick="toggleStoreFilter('HEMKÖP')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">HEMKÖP</button>
                    <button id="filter-WILLYS" onclick="toggleStoreFilter('WILLYS')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">WILLYS</button>
                </div>

                <div class="flex justify-between items-center py-
