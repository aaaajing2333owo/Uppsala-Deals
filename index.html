<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uppsala Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 flex justify-center">

    <div class="w-full max-w-md bg-[#F4F1EA] min-h-screen relative shadow-2xl overflow-hidden flex flex-col pb-24">

        <!-- ================= HOME VIEW ================= -->
        <div id="home-view" class="block flex-1 overflow-y-auto">
            
            <header class="bg-[#8A151B] text-white pt-10 pb-3 px-4 sticky top-0 z-50 shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center space-x-2">
                        <h1 class="text-[17px] font-black tracking-tight font-sans">UPPSALA DEALS</h1>
                        <button onclick="fetchData()" class="text-white/80 hover:text-white active:scale-95 transition-transform p-1">
                            <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                    <div class="flex bg-black/20 rounded-full p-0.5 text-[10px]" id="time-toggle-home">
                        <button onclick="setWeek('this')" class="time-btn-this px-2 py-1 bg-white text-[#8A151B] rounded-full font-bold shadow-sm transition-colors">本周</button>
                        <button onclick="setWeek('next')" class="time-btn-next px-2 py-1 text-white/80 rounded-full font-medium transition-colors">下周</button>
                    </div>
                </div>
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" placeholder="搜索商品..." class="block w-full pl-9 pr-3 py-1.5 border border-transparent rounded-full leading-5 bg-white/10 text-white placeholder-white/70 focus:outline-none focus:bg-white focus:text-gray-900 text-[13px] transition-colors">
                </div>
            </header>

            <main class="px-4 mt-4 space-y-5">
                <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                    <h2 class="text-base font-black text-gray-900 mb-3 tracking-wide">本周周报</h2>
                    <div id="weekly-report-container" class="space-y-3 text-[13px] leading-snug text-gray-600">
                        <div>拉取中...</div>
                    </div>
                </section>

                <section>
                    <div class="grid grid-cols-5 gap-2">
                        <div id="home-store-ICA" class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">ICA</div>
                        <div id="home-store-HEMKÖP" class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">HEMKÖP</div>
                        <div id="home-store-WILLYS" class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">WILLYS</div>
                        <div id="home-store-LIDL" class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">LIDL</div>
                        <div id="home-store-COOP" class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100">COOP</div>
                    </div>
                </section>

                <section>
                    <div class="flex justify-between items-end mb-3">
                        <h2 class="text-[15px] font-black text-gray-900 tracking-wide">精选超值折扣</h2>
                        <div class="flex bg-gray-200 rounded-full p-0.5 text-[9px]" id="distance-toggle">
                            <button onclick="toggleUIState('distance', 'nearest', 'distance-toggle')" class="px-2 py-1 bg-white text-gray-900 rounded-full font-bold shadow-sm transition-colors">离我最近</button>
                            <button onclick="toggleUIState('distance', '3km', 'distance-toggle')" class="px-2 py-1 text-gray-500 rounded-full font-medium transition-colors">3km内</button>
                        </div>
                    </div>
                    
                    <div id="home-products-container" class="grid grid-cols-2 gap-2"></div>
                    <!-- 明确的暂无数据提示 -->
                    <div id="home-empty-state" class="hidden text-center text-gray-400 text-[13px] py-10 bg-white rounded-xl border border-gray-100 font-medium">暂无数据</div>

                    <button onclick="toggleView('all-items-view')" class="w-full mt-3 py-2.5 border border-[#8A151B] text-[#8A151B] font-bold text-[12px] rounded-xl flex items-center justify-center space-x-1 bg-white shadow-sm active:bg-[#8A151B] active:text-white transition-colors">
                        <span>浏览全部打折商品</span>
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </section>
            </main>
        </div>


        <!-- ================= ALL ITEMS VIEW ================= -->
        <div id="all-items-view" class="hidden flex-1 flex flex-col h-full bg-[#F4F1EA]">
            
            <header class="bg-[#8A151B] text-white pt-10 pb-0 px-4 sticky top-0 z-50 shadow-md flex-shrink-0">
                <div class="flex items-center space-x-2 mb-3">
                    <button onclick="toggleView('home-view')" class="text-white p-1 -ml-1 active:bg-white/10 rounded-full transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h1 class="text-[17px] font-black tracking-tight font-sans flex-1">全部折扣</h1>
                </div>
                
                <div class="flex overflow-x-auto no-scrollbar space-x-5 pb-2 text-[13px] font-medium" id="category-tabs">
                    <button onclick="toggleCategory(this)" class="category-btn text-white font-bold whitespace-nowrap border-b-2 border-white pb-1 transition-all">精选</button>
                    <button onclick="toggleCategory(this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all">肉禽蛋</button>
                    <button onclick="toggleCategory(this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all">水产海鲜</button>
                    <button onclick="toggleCategory(this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all">时令果蔬</button>
                    <button onclick="toggleCategory(this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all">乳品烘焙</button>
                    <button onclick="toggleCategory(this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all">粮油副食</button>
                    <button onclick="toggleCategory(this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all">零食水饮</button>
                    <button onclick="toggleCategory(this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all">个护家清</button>
                    <button onclick="toggleCategory(this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all">宠物</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto px-3 pt-2">
                
                <div class="flex overflow-x-auto no-scrollbar space-x-2 py-1 mb-1">
                    <button id="filter-all" onclick="toggleStoreFilter('all')" class="px-3 py-1 bg-[#8A151B] text-white text-[11px] font-bold rounded-full flex-shrink-0 shadow-sm transition-colors">全部</button>
                    <button id="filter-ICA" onclick="toggleStoreFilter('ICA')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">ICA</button>
                    <button id="filter-HEMKÖP" onclick="toggleStoreFilter('HEMKÖP')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">HEMKÖP</button>
                    <button id="filter-WILLYS" onclick="toggleStoreFilter('WILLYS')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">WILLYS</button>
                    <button id="filter-LIDL" onclick="toggleStoreFilter('LIDL')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">LIDL</button>
                    <button id="filter-COOP" onclick="toggleStoreFilter('COOP')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">COOP</button>
                </div>

                <div class="flex justify-between items-center py-2 mb-2 text-[11px]">
                    <div class="flex bg-gray-200 rounded-full p-0.5 text-[10px]" id="time-toggle-all">
                        <button onclick="setWeek('this')" class="time-btn-this px-2 py-1 bg-white text-gray-900 rounded-full font-bold shadow-sm transition-colors">本周</button>
                        <button onclick="setWeek('next')" class="time-btn-next px-2 py-1 text-gray-500 rounded-full font-medium transition-colors">下周</button>
                    </div>
                    <div class="flex items-center space-x-3 text-gray-500 font-medium" id="sort-controls">
                        <button onclick="toggleSort(this)" class="sort-btn text-[#8A151B] font-bold">综合</button>
                        <button onclick="toggleSort(this)" class="sort-btn flex items-center space-x-0.5"><span>折扣</span><span class="text-[9px]">↓</span></button>
                        <button onclick="toggleSort(this)" class="sort-btn flex items-center space-x-0.5"><span>价格</span><span class="text-[9px]">↑</span></button>
                    </div>
                </div>

                <div id="all-products-container" class="grid grid-cols-2 gap-2 pb-8 mt-2"></div>
                <!-- 明确的暂无数据提示 -->
                <div id="empty-state" class="hidden text-center text-gray-400 text-[13px] py-16 font-medium">暂无数据</div>
            </main>
        </div>

    </div>

    <script>
        let products = [];
        let selectedStores = new Set();
        let currentWeek = 'this';

        function fetchData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('animate-spin');
            
            document.getElementById('home-products-container').innerHTML = '<div class="text-[12px] text-gray-500 py-4 col-span-2">同步数据中...</div>';
            document.getElementById('all-products-container').innerHTML = '';

            fetch('data.json?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) throw new Error('网络请求报错');
                    return response.json();
                })
                .then(data => {
                    if (Array.isArray(data)) {
                        products = data;
                        renderWeeklyReport(null);
                    } else {
                        products = data.products || [];
                        renderWeeklyReport(data.report || []);
                    }
                    
                    renderData();
                    setTimeout(() => icon.classList.remove('animate-spin'), 500);
                })
                .catch(error => {
                    console.error('加载失败:', error);
                    document.getElementById('home-products-container').innerHTML = '<div class="text-[12px] text-[#8A151B] py-4 col-span-2">拉取失败，请检查数据流</div>';
                    icon.classList.remove('animate-spin');
                });
        }

        fetchData();

        function renderWeeklyReport(reportData) {
            const container = document.getElementById('weekly-report-container');
            if (!reportData || reportData.length === 0) {
                container.innerHTML = `
                    <div><span class="font-black text-[#B8860B] block mb-0.5">自动摘要生成中</span>爬虫系统正在分析本周超市折扣变动，请稍后刷新查看最新洞察。</div>
                `;
                return;
            }
            container.innerHTML = reportData.map((item, index) => `
                ${index > 0 ? '<div class="h-px bg-gray-100 w-full"></div>' : ''}
                <div><span class="font-black text-[#B8860B] block mb-0.5">${item.title}</span>${item.content}</div>
            `).join('');
        }

        function setWeek(weekValue) {
            currentWeek = weekValue;
            
            document.querySelectorAll('.time-btn-this').forEach(btn => {
                const isRedBg = btn.parentElement.id === 'time-toggle-home';
                btn.className = currentWeek === 'this' 
                    ? (isRedBg ? "time-btn-this px-2 py-1 bg-white text-[#8A151B] rounded-full font-bold shadow-sm transition-colors" : "time-btn-this px-2 py-1 bg-white text-gray-900 rounded-full font-bold shadow-sm transition-colors")
                    : (isRedBg ? "time-btn-this px-2 py-1 text-white/80 rounded-full font-medium transition-colors" : "time-btn-this px-2 py-1 text-gray-500 rounded-full font-medium transition-colors");
            });

            document.querySelectorAll('.time-btn-next').forEach(btn => {
                const isRedBg = btn.parentElement.id === 'time-toggle-home';
                btn.className = currentWeek === 'next'
                    ? (isRedBg ? "time-btn-next px-2 py-1 bg-white text-[#8A151B] rounded-full font-bold shadow-sm transition-colors" : "time-btn-next px-2 py-1 bg-white text-gray-900 rounded-full font-bold shadow-sm transition-colors")
                    : (isRedBg ? "time-btn-next px-2 py-1 text-white/80 rounded-full font-medium transition-colors" : "time-btn-next px-2 py-1 text-gray-500 rounded-full font-medium transition-colors");
            });

            renderData();
        }

        function toggleStoreFilter(storeName) {
            if (storeName === 'all') {
                selectedStores.clear();
            } else {
                selectedStores.has(storeName) ? selectedStores.delete(storeName) : selectedStores.add(storeName);
            }
            renderData();
        }

        // 超市按钮置灰状态控制
        function updateStoreUI(availableStores) {
            const storeList = ['ICA', 'HEMKÖP', 'WILLYS', 'LIDL', 'COOP'];
            
            const active = "px-3 py-1 bg-[#8A151B] text-white text-[11px] font-bold rounded-full flex-shrink-0 shadow-sm transition-colors";
            const inactive = "px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors";
            const disabled = "px-3 py-1 bg-gray-100 text-gray-300 border border-transparent text-[11px] font-medium rounded-full flex-shrink-0 pointer-events-none";
            
            document.getElementById('filter-all').className = selectedStores.size === 0 ? active : inactive;
            
            storeList.forEach(store => {
                const filterBtn = document.getElementById(`filter-${store}`);
                const homeCard = document.getElementById(`home-store-${store}`);
                
                if (!availableStores.has(store)) {
                    // 无数据：置灰，不可点击
                    if (filterBtn) filterBtn.className = disabled;
                    if (homeCard) homeCard.className = "h-10 bg-gray-100 rounded-lg flex items-center justify-center font-black text-gray-300 text-[11px] border border-gray-100";
                } else {
                    // 有数据：正常逻辑
                    if (filterBtn) filterBtn.className = selectedStores.has(store) ? active : inactive;
                    if (homeCard) homeCard.className = "h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] border border-gray-100";
                }
            });
        }

        function toggleCategory(clickedBtn) {
            const btns = document.querySelectorAll('.category-btn');
            btns.forEach(btn => {
                btn.className = "category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1 transition-all";
            });
            clickedBtn.className = "category-btn text-white font-bold whitespace-nowrap border-b-2 border-white pb-1 transition-all";
        }

        function toggleSort(clickedBtn) {
            const btns = document.querySelectorAll('.sort-btn');
            btns.forEach(btn => {
                btn.classList.remove('text-[#8A151B]', 'font-bold');
                btn.classList.add('text-gray-500');
            });
            clickedBtn.classList.remove('text-gray-500');
            clickedBtn.classList.add('text-[#8A151B]', 'font-bold');
        }

        function toggleUIState(type, value, containerId) {
            const container = document.getElementById(containerId);
            const buttons = container.getElementsByTagName('button');
            if(type === 'distance') {
                buttons[0].className = "px-2 py-1 text-gray-500 rounded-full font-medium transition-colors";
                buttons[1].className = "px-2 py-1 text-gray-500 rounded-full font-medium transition-colors";
                const activeIndex = value === 'nearest' ? 0 : 1;
                buttons[activeIndex].className = "px-2 py-1 bg-white text-gray-900 rounded-full font-bold shadow-sm transition-colors";
            }
        }

        function renderData() {
            // 按当前选择的时间过滤数据
            let timeFiltered = products.filter(p => (p.week || 'this') === currentWeek);
            
            // 提取当前时间段内有数据的超市集合
            let availableStores = new Set(timeFiltered.map(p => p.store));
            
            // 防御性清理：如果已选的超市在当前时间段无数据，则从筛选池中移除
            selectedStores.forEach(s => {
                if(!availableStores.has(s)) selectedStores.delete(s);
            });

            // 更新超市按钮（置灰/激活）
            updateStoreUI(availableStores);

            // 渲染主页
            const homeContainer = document.getElementById('home-products-container');
            const homeEmpty = document.getElementById('home-empty-state');
            if(timeFiltered.length === 0) {
                homeContainer.innerHTML = '';
                homeEmpty.classList.remove('hidden');
            } else {
                homeEmpty.classList.add('hidden');
                homeContainer.innerHTML = timeFiltered.slice(0, 4).map(createCardHTML).join('');
            }

            // 渲染全量页
            let finalFiltered = selectedStores.size > 0 
                ? timeFiltered.filter(p => selectedStores.has(p.store)) 
                : timeFiltered;

            const allContainer = document.getElementById('all-products-container');
            const allEmpty = document.getElementById('empty-state');
            if (finalFiltered.length === 0) {
                allContainer.innerHTML = '';
                allEmpty.classList.remove('hidden');
            } else {
                allEmpty.classList.add('hidden');
                allContainer.innerHTML = finalFiltered.map(createCardHTML).join('');
            }
        }

        function createCardHTML(p) {
            return `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 relative pb-2 flex flex-col">
                    <div class="absolute top-1.5 right-1.5 bg-[#8A151B] text-white font-bold text-[9px] px-1 py-0.5 rounded z-10">${p.discount || '特价'}</div>
                    <div class="h-24 bg-gray-100 w-full relative shrink-0">
                        <div class="w-full h-full object-cover bg-gray-200 flex items-center justify-center text-gray-400 text-xs">商品图</div>
                        <div class="absolute bottom-1.5 left-1.5 bg-white/90 backdrop-blur text-[#8A151B] font-black text-[8px] px-1 py-0.5 rounded shadow-sm">${p.store}</div>
                    </div>
                    <div class="p-2 flex flex-col justify-between flex-1">
                        <div>
                            <h3 class="text-[12px] font-bold text-gray-900 leading-tight">${p.name}</h3>
                            <p class="text-[9px] text-gray-500 mt-1">${p.specs}</p>
                        </div>
                        <div class="mt-2 flex items-end justify-between">
                            <div class="flex items-baseline space-x-1">
                                <span class="text-[#8A151B] font-black text-[15px] leading-none">${p.currentPrice}<span class="text-[9px] font-normal">kr</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleView(viewId) {
            const home = document.getElementById('home-view');
            const all = document.getElementById('all-items-view');
            if (viewId === 'all-items-view') {
                home.classList.replace('flex-1', 'hidden');
                all.classList.replace('hidden', 'flex-1');
            } else {
                all.classList.replace('flex-1', 'hidden');
                home.classList.replace('hidden', 'flex-1');
            }
        }
    </script>
</body>
</html>
