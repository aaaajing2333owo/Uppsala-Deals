<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uppsala Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .bottom-sheet { transition: transform 0.3s ease-out; transform: translateY(100%); }
        .bottom-sheet.open { transform: translateY(0); }
        .modal-fade { transition: opacity 0.2s; opacity: 0; pointer-events: none; }
        .modal-fade.open { opacity: 1; pointer-events: auto; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .no-scroll { overflow: hidden !important; }
    </style>
</head>
<body class="bg-gray-900 flex justify-center">

    <div class="w-full max-w-md bg-[#F4F1EA] min-h-screen relative shadow-2xl flex flex-col pb-20 overflow-hidden">

        <!-- ================= HOME VIEW ================= -->
        <div id="home-view" class="block flex-1 overflow-y-auto">
            <header class="bg-[#8A151B] text-white pt-6 pb-3 px-4 sticky top-0 z-30 shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center space-x-2">
                        <h1 class="text-[17px] font-black tracking-tight">UPPSALA DEALS</h1>
                        <button onclick="fetchData()" class="text-white/80 hover:text-white active:scale-95 transition-transform p-1">
                            <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                    <div class="flex bg-black/20 rounded-full p-0.5 text-[10px] relative">
                        <span id="new-badge-home" class="hidden absolute -top-1.5 -right-1.5 bg-[#064E3B] text-white text-[8px] font-black px-1 rounded-sm shadow-md animate-pulse z-10">NEW</span>
                        <button onclick="setWeek('this')" class="time-btn-this px-2 py-1 bg-white text-[#8A151B] rounded-full font-bold shadow-sm transition-colors">本周</button>
                        <button onclick="setWeek('next')" class="time-btn-next px-2 py-1 text-white/80 rounded-full font-medium transition-colors">下周</button>
                    </div>
                </div>
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="" class="block w-full pl-9 pr-3 py-1.5 border border-transparent rounded-full leading-5 bg-white/10 text-white focus:outline-none focus:bg-white focus:text-gray-900 text-[13px] transition-colors">
                </div>
            </header>

            <main class="px-4 mt-3 space-y-4">
                <!-- 周报 -->
                <section class="bg-white rounded-xl p-3 shadow-sm border border-gray-100">
                    <h2 class="text-[14px] font-black text-gray-900 mb-2 tracking-wide flex items-center justify-between">
                        本周周报 <span class="text-[9px] text-gray-400 font-normal">基于数据实时生成</span>
                    </h2>
                    <div id="weekly-report-container" class="space-y-2 text-[12px] leading-snug text-gray-600">
                        <div>暂无摘要数据。</div>
                    </div>
                </section>

                <!-- 超市画报 -->
                <section>
                    <div class="grid grid-cols-3 gap-2" id="store-poster-grid"></div>
                </section>

                <!-- 精选 -->
                <!-- 浏览全部打折商品入口 (挪至精选上方) -->
                <button onclick="switchView('all-items-view')" class="w-full py-2.5 border border-[#8A151B] text-[#8A151B] font-bold text-[12px] rounded-xl flex items-center justify-center space-x-1 bg-white shadow-sm active:bg-[#8A151B] active:text-white transition-colors">
                    <span>浏览全部打折商品</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <!-- 精选 -->
                <section>
                    <div class="flex justify-between items-end mb-2">
                        <div class="flex items-center space-x-1.5">
                            <h2 class="text-[15px] font-black text-gray-900 tracking-wide">精选</h2>
                        </div>
                        <button onclick="openSettings()" class="text-gray-400 hover:text-gray-600 p-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                    <div id="home-products-container" class="grid grid-cols-2 gap-2"></div>
                    <div id="home-empty-state" class="hidden text-center text-gray-400 text-[12px] py-8 bg-white rounded-xl border border-gray-100">暂无符合条件的精选数据</div>
                </section>

                <!-- 特别关心 -->
                <section id="home-fav-section" class="pb-4 mt-4">
                    <div class="flex justify-between items-end mb-2">
                        <h2 class="text-[15px] font-black text-gray-900 tracking-wide flex items-center">特别关心</h2>
                    </div>
                    <div id="home-fav-container" class="grid grid-cols-2 gap-2"></div>
                </section>
            </main>
        </div>

        <!-- ================= ALL ITEMS VIEW ================= -->
        <div id="all-items-view" class="hidden flex-1 flex flex-col h-full bg-[#F4F1EA]">
            <header class="bg-[#8A151B] text-white pt-6 pb-0 px-4 sticky top-0 z-30 shadow-md flex-shrink-0">
                <div class="flex items-center space-x-2 mb-2">
                    <button onclick="switchView('home-view')" class="text-white p-1 -ml-1 active:bg-white/10 rounded-full transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h1 class="text-[17px] font-black tracking-tight flex-1">全部折扣商品</h1>
                </div>
                <div class="flex overflow-x-auto no-scrollbar space-x-4 pb-2 text-[13px] font-medium" id="category-tabs">
                    <button onclick="setCategory('精选', this)" class="category-btn text-white font-bold whitespace-nowrap border-b-2 border-white pb-1">精选</button>
                    <button onclick="setCategory('全部', this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">全部</button>
                    <button onclick="setCategory('肉禽蛋', this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">肉禽蛋</button>
                    <button onclick="setCategory('水产海鲜', this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">水产海鲜</button>
                    <button onclick="setCategory('时令果蔬', this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">时令果蔬</button>
                    <button onclick="setCategory('乳品饮料', this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">乳品饮料</button>
                    <button onclick="setCategory('烘焙面包', this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">烘焙面包</button>
                    <button onclick="setCategory('粮油副食', this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">粮油副食</button>
                    <button onclick="setCategory('日用百货', this)" class="category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1">日用百货</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto px-3 pt-2">
                <!-- 一级超市品牌筛选 -->
                <div class="flex overflow-x-auto no-scrollbar space-x-2 py-1" id="all-stores-filter"></div>
                
                <!-- 二级具体分店筛选 (选中含有多家分店的品牌时自动展开) -->
                <div id="sub-stores-filter" class="hidden flex overflow-x-auto no-scrollbar space-x-1.5 py-1.5 px-2 mt-1 bg-white/70 rounded-xl border border-gray-200/60 items-center"></div>

                <div class="flex justify-between items-center py-2 mb-1 text-[11px]">
                    <div class="flex bg-gray-200 rounded-full p-0.5 text-[10px]">
                        <button onclick="setWeek('this')" class="time-btn-this px-2 py-1 bg-white text-gray-900 rounded-full font-bold shadow-sm">本周</button>
                        <button onclick="setWeek('next')" class="time-btn-next px-2 py-1 text-gray-500 rounded-full font-medium">下周</button>
                    </div>
                    
                    <div class="flex items-center space-x-3 text-gray-500 font-medium bg-gray-100 px-2 py-1 rounded-full">
                        <button onclick="setCategory('特别关心', this)" id="sort-btn-fav" class="text-gray-500">特别关心</button>
                        <button onclick="setSort('discount')" id="sort-btn-discount" class="flex items-center space-x-0.5"><span>折扣</span><span id="sort-icon-discount" class="text-[9px]">↓</span></button>
                        <button onclick="setSort('price')" id="sort-btn-price" class="flex items-center space-x-0.5"><span>价格</span><span id="sort-icon-price" class="text-[9px]">↓</span></button>
                    </div>
                </div>

                <div id="all-products-container" class="grid grid-cols-2 gap-2 pb-8 mt-1"></div>
                <div id="empty-state" class="hidden text-center text-gray-400 text-[13px] py-16 font-medium">暂无数据</div>
            </main>
        </div>

        <!-- ================= POSTER SUMMARY VIEW ================= -->
        <div id="poster-summary-view" class="hidden flex-1 flex flex-col h-full bg-[#F4F1EA] z-30">
            <header class="bg-[#8A151B] text-white pt-6 pb-3 px-4 shadow-md flex-shrink-0 flex items-center space-x-2">
                <button onclick="switchView('home-view')" class="text-white p-1 -ml-1 active:bg-white/10 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h1 id="poster-summary-title" class="text-[17px] font-black tracking-tight uppercase">STORE</h1>
            </header>
            <main class="flex-1 overflow-y-auto px-4 pt-4 pb-10" id="poster-summary-container"></main>
        </div>

        <!-- ================= POSTER PDF VIEW ================= -->
        <div id="pdf-view" class="hidden flex-1 flex flex-col h-full bg-black z-30">
            <header class="bg-[#8A151B] text-white pt-6 pb-3 px-4 shadow-md flex-shrink-0 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <button onclick="switchView('poster-summary-view')" class="text-white p-1 -ml-1 active:bg-white/10 rounded-full">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h1 class="text-[14px] font-bold tracking-tight">画报详情</h1>
                </div>
            </header>
            <main class="flex-1 relative w-full h-full" id="pdf-container"></main>
        </div>

        <!-- ================= BOTTOM CART BAR ================= -->
        <div id="bottom-cart-bar" class="fixed bottom-4 left-0 right-0 max-w-md mx-auto px-4 z-20">
            <button onclick="toggleCartModal(true)" class="w-full bg-[#8A151B] text-white py-3.5 rounded-2xl font-bold text-[14px] shadow-[0_8px_20px_rgba(138,21,27,0.3)] flex items-center justify-between px-5 active:scale-95 transition-transform">
                <div class="flex items-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span>采购清单</span>
                </div>
                <div class="bg-white text-[#8A151B] px-2.5 py-0.5 rounded-full text-[12px] shadow-inner" id="cart-count">0</div>
            </button>
        </div>

        <!-- ================= HALF-SCREEN CART MODAL ================= -->
        <div id="cart-overlay" class="modal-fade fixed inset-0 bg-black/60 z-50" onclick="toggleCartModal(false)"></div>
        <div id="cart-sheet" class="bottom-sheet fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#F4F1EA] rounded-t-3xl z-50 flex flex-col max-h-[75vh]">
            <div class="w-full flex justify-center py-2 bg-white rounded-t-3xl" onclick="toggleCartModal(false)"><div class="w-10 h-1.5 bg-gray-300 rounded-full"></div></div>
            <header class="bg-white text-gray-900 pb-3 px-5 shadow-sm flex items-center justify-between">
                <h1 class="text-[17px] font-black tracking-tight">采购清单</h1>
                <button onclick="clearCart()" class="text-red-500 text-[11px] font-bold px-2 py-1 bg-red-50 rounded">清空</button>
            </header>
            <main class="flex-1 overflow-y-auto p-4" id="cart-items-container"></main>
            <div class="bg-white p-5 pb-8 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] border-t border-gray-100 flex flex-col items-end">
                <div class="flex items-end space-x-3 mb-1">
                    <span class="text-[15px] font-black text-gray-900">总计预估</span>
                    <span id="cart-total-price" class="text-[20px] font-black text-[#8A151B] leading-none">0 kr</span>
                </div>
                <p class="text-[11px] text-gray-400 font-medium">散装产品不计入</p>
            </div>
        </div>

        <!-- ================= SETTINGS MODAL ================= -->
        <div id="settings-overlay" class="modal-fade fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onclick="closeSettings()">
            <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl scale-95 transition-transform" id="settings-card" onclick="event.stopPropagation()">
                <h3 class="text-[16px] font-black text-gray-900 mb-4">精选栏目设置</h3>
                <div class="mb-5">
                    <label class="text-[13px] font-bold text-gray-700 block mb-2">最低折扣门槛</label>
                    <select id="setting-threshold" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-[13px] font-medium outline-none focus:border-[#8A151B]" onchange="updateSettings()">
                        <option value="10">9折及以下 (>10% OFF)</option>
                        <option value="20">8折及以下 (>20% OFF)</option>
                        <option value="30">7折及以下 (>30% OFF)</option>
                        <option value="40">6折及以下 (>40% OFF)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[13px] font-bold text-gray-700 block mb-2">展示超市品牌</label>
                    <div class="flex flex-wrap gap-2" id="setting-stores"></div>
                </div>
                <button onclick="closeSettings()" class="w-full mt-6 bg-[#8A151B] text-white font-bold py-2.5 rounded-xl active:scale-95 transition-transform">确定</button>
            </div>
        </div>

        <!-- ================= PRODUCT DETAIL MODAL ================= -->
        <div id="detail-overlay" class="modal-fade fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onclick="closeDetail()">
            <div id="detail-card" class="bg-white w-[92%] max-w-md rounded-2xl overflow-hidden shadow-2xl scale-95 transition-transform" onclick="event.stopPropagation()">
                <!-- JS 动态注入 -->
            </div>
        </div>

    </div>

        let currentCategory = '精选';
        let currentSort = 'default'; 
        let sortOrder = 'desc'; 
        let searchQuery = '';

        let featuredThreshold = 30;
        let featuredStores = new Set(STORES);
        
        let shoppingCart = JSON.parse(localStorage.getItem('uppsala_cart')) || [];

        let refreshCount = parseInt(localStorage.getItem('uppsala_refresh_count') || '0');
        let isNewVisible = refreshCount < 2;

        function init() {
            renderStoreFilters();
            fetchData();
        }

                    { id: "5", store: "COOP", branch: "Coop Konsum S:t Per", name: "燕麦奶", name_sv: "Havredryck", category: "乳品饮料", is_new: false, is_frozen: false, is_member: true, is_bulk: false, discount: "-25%", currentPrice: 15, originalPrice: 20, unit: "1L", unit_price: "15 kr/L", week: "this" },
                    { id: "6", store: "CITY GROSS", branch: "City Gross Boländerna", name: "散装苹果", name_sv: "Äpplen Lösvikt", category: "时令果蔬", is_new: false, is_frozen: false, is_member: false, is_bulk: true, discount: "-65%", currentPrice: 10.5, originalPrice: 30, unit: "kg", unit_price: "10.5 kr/kg", week: "this" }

        function renderWeeklyReport(reportData) {
            const container = document.getElementById('weekly-report-container');
            if (!reportData || reportData.length === 0) {
                container.innerHTML = `<div>暂无本周市场摘要。</div>`; return;
            }
            container.innerHTML = reportData.map((item, i) => `
                ${i > 0 ? '<div class="h-px bg-gray-100 w-full"></div>' : ''}
                <div><span class="font-black text-[#B8860B] mr-1">${item.title}</span>${item.content}</div>
            `).join('');
        }

        function renderStoreGrid() {
            const container = document.getElementById('store-poster-grid');
            container.innerHTML = STORES.map(store => {
                const hasData = posters[store] && posters[store].length > 0;
                const hasUpdate = hasData && isNewVisible; 
                
                const dot = hasUpdate ? `<div class="absolute top-1 left-1 w-2 h-2 bg-[#064E3B] rounded-full shadow-sm"></div>` : '';
                const style = hasData ? 'bg-white text-gray-800 shadow-sm border-gray-100 cursor-pointer' : 'bg-gray-100 text-gray-400 border-transparent pointer-events-none';
                return `<button onclick="openPosterSummary('${store}')" class="relative h-11 rounded-lg flex items-center justify-center font-black text-[12px] border active:scale-95 transition-transform tracking-wide ${style}">${dot}${store}</button>`;

        function renderStoreFilters() {
            const container = document.getElementById('all-stores-filter');
            container.innerHTML = `<button id="filter-all" onclick="toggleStoreFilter('all')" class="px-3 py-1 bg-[#8A151B] text-white text-[11px] font-bold rounded-full flex-shrink-0 shadow-sm transition-colors">全部超市</button>` + 
                STORES.map(store => `<button id="filter-${store}" onclick="toggleStoreFilter('${store}')" class="px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors">${store}</button>`).join('');
        }

        // 渲染二级分店筛选栏
        function renderSubStoreFilters(baseData) {
            const subContainer = document.getElementById('sub-stores-filter');
            if (selectedStores.size === 0) {
                subContainer.classList.add('hidden');
                selectedBranches.clear();
                return;
            }

            // 收集当前选中品牌下的所有可用分店（合并预设分店与实际商品分店）
            let branches = [];
            selectedStores.forEach(store => {
                const dynamicBranches = baseData.filter(p => p.store === store).map(p => p.branch);
                const presetBranches = STORE_BRANCHES[store] || [];
                const merged = [...new Set([...dynamicBranches, ...presetBranches])];
                merged.forEach(b => {
                    if (b && b !== store) branches.push({ store, branch: b });
                });
            });

            if (branches.length === 0) {
                subContainer.classList.add('hidden');
                return;
            }

            subContainer.classList.remove('hidden');
            const allActive = selectedBranches.size === 0;
            const activeCls = "px-2.5 py-0.5 bg-[#8A151B] text-white text-[10px] font-bold rounded-full flex-shrink-0 shadow-sm transition-colors";
            const inactiveCls = "px-2.5 py-0.5 bg-gray-100 text-gray-600 text-[10px] font-medium rounded-full flex-shrink-0 transition-colors";

            // 精简分店显示名（去掉前缀品牌名以便紧凑展示）
            const shortName = (b, s) => b.replace(new RegExp(`^${s}\\s*`, 'i'), '').trim() || b;

            subContainer.innerHTML = `
                <span class="text-[10px] font-bold text-gray-400 pl-1 pr-1 flex-shrink-0">分店:</span>
                <button onclick="toggleBranchFilter('all')" class="${allActive ? activeCls : inactiveCls}">全部</button>
                ${branches.map(item => `
                    <button onclick="toggleBranchFilter('${item.branch}')" class="${selectedBranches.has(item.branch) ? activeCls : inactiveCls}">
                        ${shortName(item.branch, item.store)}
                    </button>
                `).join('')}
            `;
        }

        function toggleBranchFilter(branchName) {
            if (branchName === 'all') {
                selectedBranches.clear();
            } else {
                selectedBranches.has(branchName) ? selectedBranches.delete(branchName) : selectedBranches.add(branchName);
            }
            renderData();
        }

            document.body.classList.add('no-scroll');
            document.getElementById('setting-threshold').value = featuredThreshold;
            renderSettingStores();
            const overlay = document.getElementById('settings-overlay');
            const card = document.getElementById('settings-card');
            overlay.classList.add('open');

            const container = document.getElementById('setting-stores');
            container.innerHTML = STORES.map(s => `
                <button onclick="toggleSettingStore('${s}')" class="px-3 py-1 text-[11px] font-bold rounded-full border transition-colors ${featuredStores.has(s) ? 'bg-[#8A151B] text-white border-[#8A151B]' : 'bg-gray-100 text-gray-400 border-transparent'}">${s}</button>
            `).join('');
        }

        function toggleSettingStore(store) {
            if(featuredStores.has(store)) featuredStores.delete(store);
            else featuredStores.add(store);
            renderSettingStores();
            updateSettings();

        function updateSettings() {
            featuredThreshold = parseInt(document.getElementById('setting-threshold').value);
            renderData();

            document.body.classList.remove('no-scroll');
            const overlay = document.getElementById('settings-overlay');

        // ================= 提亮柔和后的红底白字折扣色阶 (5级) =================
        function getDiscountStyle(discountStr) {
            let val = parseInt((discountStr||"").replace(/[^\d]/g, ''));
            if(isNaN(val)) return 'bg-[#B83336] text-white';
            if(val >= 40) return 'bg-[#9E2A2B] text-white'; // 6折以上 (醇厚砖红，不发黑)
            if(val >= 30) return 'bg-[#B5383A] text-white'; // 6-7折 (柔和深红)
            if(val >= 20) return 'bg-[#C84B4D] text-white'; // 7-8折 (明亮暖红)
            if(val >= 10) return 'bg-[#D65F61] text-white'; // 8-9折 (浅珊瑚红)
            return 'bg-[#E27678] text-white';               // 9折以下 (淡玫瑰红)
        }

        const frozenSVG = `<svg class="inline-block w-3.5 h-3.5 text-blue-400 ml-1 relative -top-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v18m9-9H3m15.364-6.364l-12.728 12.728m12.728 0L3.636 5.636"></path></svg>`;

        // 外层卡片渲染：左下角显示统一超市品牌名，且超市/会员/折扣标签高度与字号完全统一

                : `<svg class="w-4 h-4 text-gray-300 hover:text-red-300" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45 1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>`;
            
            // 统一外层卡片标签尺寸：h-5 px-1.5 text-[10px] rounded flex items-center
            const badgeBase = "h-5 px-1.5 text-[10px] font-bold rounded shadow-sm inline-flex items-center justify-center leading-none";
            const newTagImg = (p.is_new && isNewVisible) ? `<div class="absolute top-1.5 left-1.5 bg-[#064E3B] text-white ${badgeBase} z-10">NEW</div>` : '';
            const frozenTag = p.is_frozen ? frozenSVG : '';
            const memberTag = p.is_member ? `<span class="bg-[#D4AF37] text-white ${badgeBase}">会员</span>` : '';
            const colorClass = getDiscountStyle(p.discount || "");
            
            const cartItem = shoppingCart.find(i => i.id === p.id);
            const qty = cartItem ? cartItem.qty : 0;
            
            const ctrlUI = qty > 0 
                ? `<div class="flex items-center bg-gray-100 rounded-full overflow-hidden shadow-inner border border-gray-200">
                    <button onclick="updateCart('${p.id}', -1, event)" class="w-7 h-7 flex items-center justify-center text-[#8A151B] font-bold active:bg-gray-200">-</button>
                    <span class="text-[12px] font-bold w-4 text-center">${qty}</span>
                    <button onclick="updateCart('${p.id}', 1, event)" class="w-7 h-7 flex items-center justify-center text-[#8A151B] font-bold active:bg-gray-200">+</button>
                   </div>`
                : `<button onclick="addToCart('${p.id}', event)" class="w-7 h-7 rounded-full bg-[#8A151B] text-white flex items-center justify-center shadow-md active:scale-90 transition-transform">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                   </button>`;

            return `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 relative pb-2 flex flex-col transition-transform select-none cursor-pointer" ondblclick="toggleFavorite('${p.id}', event)" onclick="openDetail('${p.id}')">
                    ${newTagImg}
                    <div class="absolute top-1.5 right-1.5 ${colorClass} ${badgeBase} z-10">${p.discount || '特价'}</div>
                    
                    <div class="h-32 bg-gray-50 w-full relative shrink-0">
                        <img src="${p.image_url || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80'}" 
     class="w-full h-full object-cover" 
     alt="img"
     onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80'" />
                        <div class="absolute bottom-1.5 left-1.5 flex items-center space-x-1">
                            <!-- 外层卡片仅显示统一超市品牌名称 -->
                            <span class="bg-white/95 backdrop-blur text-[#8A151B] ${badgeBase}">${p.store}</span>
                            ${memberTag}
                        </div>
                        <button onclick="toggleFavorite('${p.id}', event)" class="absolute bottom-1.5 right-1.5 p-1.5 z-20 bg-white/70 rounded-full backdrop-blur">
                            ${favSvg}

                    </div>
                    
                    <div class="p-2.5 flex flex-col justify-between flex-1">

                            <p class="text-[11px] text-gray-500 font-medium mt-0.5 block truncate">${p.name_sv || ''}</p>
                            ${p.history_low ? `<div class="mt-1.5"><span class="bg-[#064E3B]/10 text-[#064E3B] text-[9px] px-1.5 py-0.5 rounded font-bold border border-[#064E3B]/20">平30天史低</span></div>` : ''}
                        </div>
                        <div class="mt-2 flex items-end justify-between">
                            <div class="flex flex-col items-start justify-end h-9">
                                ${p.originalPrice ? `<span class="text-[10px] text-gray-400 line-through leading-none mb-0.5">${p.originalPrice} kr</span>` : '<span class="text-[10px] text-transparent leading-none mb-0.5">0</span>'}
                                <span class="text-[#8A151B] font-black text-[18px] leading-none">${p.currentPrice}<span class="text-[10px] font-normal ml-0.5">kr/${p.unit}</span></span>

                            <div class="relative z-20 h-9 flex items-end pb-0.5">${ctrlUI}</div>

        // ================= 视图路由 =================
        function switchView(viewId) {
            ['home-view', 'all-items-view', 'poster-summary-view', 'pdf-view'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.classList.remove('flex-1'); el.classList.add('hidden'); }
            });
            const target = document.getElementById(viewId);
            target.classList.remove('hidden');
            target.classList.add('flex-1');
            target.scrollTop = 0; 
            
            const cartBar = document.getElementById('bottom-cart-bar');
            if(viewId === 'pdf-view' || viewId === 'poster-summary-view') cartBar.classList.add('hidden');
            else cartBar.classList.remove('hidden');
        }

        function openPosterSummary(storeName) {
            document.getElementById('poster-summary-title').innerText = storeName;
            const container = document.getElementById('poster-summary-container');
            const list = posters[storeName];
            
            if (!list || list.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 text-[13px] font-medium mt-10">暂未获取到 ${storeName} 本周数据</div>`;
            } else {
                container.innerHTML = `<div class="grid grid-cols-1 gap-4">` + list.map(item => `
                    <div onclick="openPDF('${item.url}')" class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 active:scale-[0.98] transition-transform cursor-pointer">
                        <div class="h-40 bg-gray-200 relative">
                            <img src="${item.preview || 'https://placehold.co/600x400/E2E8F0/94A3B8?text=Preview'}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3.5 flex justify-between items-center">
                            <div>
                                <h3 class="font-black text-gray-900 text-[14px]">${item.title || storeName + ' 画报'}</h3>
                                <p class="text-[11px] text-gray-500 mt-1 font-medium">有效期: ${item.valid}</p>
                            </div>
                            <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-[#8A151B]">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

                        </div>
                    </div>

        function openPDF(url) {
            if(!url) { alert("画报链接失效或不存在"); return; }
            const container = document.getElementById('pdf-container');
            container.innerHTML = `<iframe src="${url}#toolbar=0" class="w-full h-full border-none bg-white"></iframe>`;
            switchView('pdf-view');
        }

        function updateNEWBadge(isNew) {
            const b = document.getElementById('new-badge-home');
            if (isNew) b.classList.remove('hidden'); else b.classList.add('hidden');
        }

        function setWeek(weekValue) {
            currentWeek = weekValue;
            updateNEWBadge(false); 
            document.querySelectorAll('.time-btn-this').forEach(btn => {
                const isRed = btn.parentElement.parentElement.tagName === 'HEADER'; 
                btn.className = currentWeek === 'this' ? `time-btn-this px-2 py-1 bg-white ${isRed?'text-[#8A151B]':'text-gray-900'} rounded-full font-bold shadow-sm` : "time-btn-this px-2 py-1 text-gray-500 rounded-full font-medium";
            });
            document.querySelectorAll('.time-btn-next').forEach(btn => {
                const isRed = btn.parentElement.parentElement.tagName === 'HEADER';
                btn.className = currentWeek === 'next' ? `time-btn-next px-2 py-1 bg-white ${isRed?'text-[#8A151B]':'text-gray-900'} rounded-full font-bold shadow-sm` : "time-btn-next px-2 py-1 text-gray-500 rounded-full font-medium";
            });
            renderData();
        }

        function toggleStoreFilter(storeName) {
            if (storeName === 'all') {
                selectedStores.clear();
                selectedBranches.clear();
            } else {
                if (selectedStores.has(storeName)) {
                    selectedStores.delete(storeName);
                    // 移除该品牌下的已选分店
                    (STORE_BRANCHES[storeName] || []).forEach(b => selectedBranches.delete(b));
                } else {
                    selectedStores.add(storeName);
                }
            }
            renderData();
        }

        function setCategory(cat, btnEl) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn text-white/70 whitespace-nowrap border-b-2 border-transparent pb-1";
            });
            document.getElementById('sort-btn-fav').className = "text-gray-500";
            
            if(cat === '特别关心' && btnEl.id === 'sort-btn-fav') {
                btnEl.className = "text-[#8A151B] font-bold";
            } else if (btnEl) {
                btnEl.className = "category-btn text-white font-bold whitespace-nowrap border-b-2 border-white pb-1";
            }
            renderData();
        }

        function setSort(type) {
            if(currentCategory === '特别关心') setCategory('全部', document.querySelector('.category-btn:nth-child(2)'));
            if (currentSort === type && type !== 'default') sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
            else { currentSort = type; sortOrder = type === 'price' ? 'asc' : 'desc'; }

            ['discount', 'price'].forEach(t => {
                const btn = document.getElementById(`sort-btn-${t}`);
                if(t === 'default') btn.className = currentSort === t ? "text-[#8A151B] font-bold" : "text-gray-500";
                else {
                    btn.className = currentSort === t ? "flex items-center space-x-0.5 text-[#8A151B] font-bold" : "flex items-center space-x-0.5 text-gray-500";
                    if(currentSort === t) document.getElementById(`sort-icon-${t}`).innerText = sortOrder === 'desc' ? '↓' : '↑';
                }
            });
            renderData();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            renderData();
        }

        // ================= 采购清单与加购联动 =================
        function toggleFavorite(id, e) {
            if(e) e.stopPropagation();
            if (favoriteItems.has(id)) favoriteItems.delete(id); else favoriteItems.add(id);
            localStorage.setItem('uppsala_favorites', JSON.stringify([...favoriteItems]));
            renderData(); 
        }

        function addToCart(id, e) {
            if(e) e.stopPropagation();
            const p = products.find(i => i.id === id);
            if(!p) return;
            shoppingCart.push({ 
                id: p.id, 
                name: p.name, 
                name_sv: p.name_sv, 
                price: parseFloat(p.currentPrice), 
                store: p.store, 
                branch: p.branch || p.store, 
                is_bulk: p.is_bulk, 
                qty: 1 
            });
            localStorage.setItem('uppsala_cart', JSON.stringify(shoppingCart));
            renderData();
            updateCartUI();
            if (currentDetailId === id) renderDetailContent(id);
        }

        function updateCart(id, change, e) {
            if(e) e.stopPropagation();
            let item = shoppingCart.find(i => i.id === id);
            if(item) {
                item.qty += change;
                if(item.qty <= 0) shoppingCart = shoppingCart.filter(i => i.id !== id);
            }
            localStorage.setItem('uppsala_cart', JSON.stringify(shoppingCart));
            renderData(); 
            updateCartUI();
            if (currentDetailId === id) renderDetailContent(id);
        }

        function clearCart() {
            shoppingCart = [];
            localStorage.removeItem('uppsala_cart');
            renderData();
            updateCartUI();
            if (currentDetailId) renderDetailContent(currentDetailId);
        }

        function toggleCartModal(show) {
            const overlay = document.getElementById('cart-overlay');
            const sheet = document.getElementById('cart-sheet');
            if(show) {
                document.body.classList.add('no-scroll');
                overlay.classList.add('open');
                setTimeout(() => sheet.classList.add('open'), 10);
            } else {
                document.body.classList.remove('no-scroll');
                sheet.classList.remove('open');
                setTimeout(() => overlay.classList.remove('open'), 300);
            }
        }

        function updateCartUI() {
            const count = shoppingCart.reduce((sum, item) => sum + (item.is_bulk ? 0 : item.qty), 0);
            document.getElementById('cart-count').innerText = count;
            
            const container = document.getElementById('cart-items-container');
            if(shoppingCart.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 text-[13px] py-10 font-medium">清单为空</div>';
                document.getElementById('cart-total-price').innerText = '0 kr';
                return;
            }
            
            let total = 0;
            let storesData = {};
            shoppingCart.forEach(item => {
                const groupKey = item.branch || item.store; // 清单按具体分店分组
                if(!storesData[groupKey]) storesData[groupKey] = [];
                storesData[groupKey].push(item);
                if(!item.is_bulk) total += item.price * item.qty;
            });

            container.innerHTML = Object.keys(storesData).map(groupKey => {
                const itemsHtml = storesData[groupKey].map(item => {
                    const qtyStr = item.is_bulk ? `<span class="text-[12px] font-bold text-gray-500 w-10 text-center">散装</span>` : `<span class="text-[14px] font-bold w-8 text-center">${item.qty}</span>`;
                    const priceStr = item.is_bulk ? `${item.price} kr/kg` : `${(item.price * item.qty).toFixed(2)} kr`;
                    return `
                        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 flex flex-col">
                            <div class="flex justify-between items-start mb-2.5">
                                <div>
                                    <div class="flex items-center mb-0.5"><span class="text-[14px] font-bold text-gray-900">${item.name}</span></div>
                                    <span class="text-[11px] text-gray-500 font-medium">${item.name_sv}</span>
                                </div>
                                <span class="text-[#8A151B] font-black text-[15px]">${priceStr}</span>
                            </div>
                            <div class="flex justify-end">
                                <div class="flex items-center bg-gray-100 rounded-full overflow-hidden border border-gray-200">
                                    <button onclick="updateCart('${item.id}', -1)" class="w-10 h-8 flex items-center justify-center text-[#8A151B] font-bold text-lg active:bg-gray-200">-</button>
                                    ${qtyStr}
                                    <button onclick="updateCart('${item.id}', 1)" class="w-10 h-8 flex items-center justify-center text-[#8A151B] font-bold text-lg active:bg-gray-200">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                return `
                    <div class="mb-4">
                        <div class="text-[12px] font-black text-gray-500 mb-2 pl-1">${groupKey}</div>
                        <div class="space-y-2.5">${itemsHtml}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('cart-total-price').innerText = total.toFixed(2) + ' kr';
        }

        // ================= 弹窗详情（完整分店名 + 统一标签尺寸 + 直接加购） =================
        function openDetail(id) {
            currentDetailId = id;
            document.body.classList.add('no-scroll');
            renderDetailContent(id);
            const overlay = document.getElementById('detail-overlay');
            const card = document.getElementById('detail-card');
            overlay.classList.add('open');
            setTimeout(() => card.classList.replace('scale-95', 'scale-100'), 10);
        }

        function renderDetailContent(id) {
            const p = products.find(i => i.id === id);
            if(!p) return;
            const card = document.getElementById('detail-card');
            
            const colorClass = getDiscountStyle(p.discount || "");
            const historyTag = p.history_low ? `<div class="bg-teal-50 border border-teal-200 p-3 rounded-xl mt-4 flex items-center justify-between"><span class="text-[13px] text-[#064E3B] font-bold">历史价格对比</span><span class="bg-[#064E3B] text-white text-[10px] px-2 py-1 rounded shadow-sm font-bold">平30天史低</span></div>` : '';
            
            // 详情页标签尺寸完全统一：h-6 px-2.5 text-[11px] font-bold rounded shadow-md inline-flex items-center justify-center
            const detailBadgeBase = "h-6 px-2.5 text-[11px] font-bold rounded shadow-md inline-flex items-center justify-center leading-none";
            const fullStoreName = p.branch || p.store;
            const memberTag = p.is_member ? `<span class="bg-[#D4AF37] text-white ${detailBadgeBase}">会员</span>` : '';
            const frozenTag = p.is_frozen ? frozenSVG : '';

            // 详情页加购控制器
            const cartItem = shoppingCart.find(i => i.id === p.id);
            const qty = cartItem ? cartItem.qty : 0;
            const detailCartUI = qty > 0 
                ? `<div class="flex items-center bg-gray-100 rounded-full overflow-hidden shadow-inner border border-gray-200 h-10">
                    <button onclick="updateCart('${p.id}', -1, event)" class="w-10 h-10 flex items-center justify-center text-[#8A151B] font-bold text-lg active:bg-gray-200">-</button>
                    <span class="text-[14px] font-bold w-6 text-center">${qty}</span>
                    <button onclick="updateCart('${p.id}', 1, event)" class="w-10 h-10 flex items-center justify-center text-[#8A151B] font-bold text-lg active:bg-gray-200">+</button>
                   </div>`
                : `<button onclick="addToCart('${p.id}', event)" class="h-10 px-4 rounded-full bg-[#8A151B] text-white font-bold text-[13px] flex items-center space-x-1.5 shadow-md active:scale-95 transition-transform">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    <span>加入清单</span>
                   </button>`;

            card.innerHTML = `
                <div class="relative w-full h-64 bg-gray-100">
                    <img src="${p.image_url || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80'}" 
     class="w-full h-full object-cover" 
     alt="details"
     onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80'" />
                    <button onclick="closeDetail()" class="absolute top-4 right-4 w-9 h-9 bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur hover:bg-black/70 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                    <!-- 详情页展示完整超市分店名，且三个标签高度字号完全一致 -->
                    <div class="absolute bottom-4 left-4 right-4 flex flex-wrap gap-1.5 items-center">
                        <span class="bg-white/95 text-[#8A151B] ${detailBadgeBase}">${fullStoreName}</span>
                        ${memberTag}
                        <span class="${colorClass} ${detailBadgeBase}">${p.discount}</span>
                    </div>
                </div>
                <div class="p-6">
                    <h2 class="text-xl font-black text-gray-900 flex items-center">${p.name}${frozenTag}</h2>
                    <p class="text-[13px] text-gray-500 font-medium mt-1 mb-4">${p.name_sv}</p>
                    <div class="flex items-end justify-between">
                        <div>
                            <div class="flex items-end space-x-2">
                                <span class="text-[#8A151B] font-black text-3xl leading-none">${p.currentPrice}<span class="text-base font-normal ml-1">kr/${p.unit}</span></span>
                                ${p.originalPrice ? `<span class="text-base text-gray-400 line-through mb-0.5">${p.originalPrice} kr</span>` : ''}
                            </div>
                            <div class="text-[12px] text-gray-500 mt-2 font-medium">比较单价: <span class="text-gray-800">${p.unit_price}</span></div>
                        </div>
                        <div>${detailCartUI}</div>
                    </div>
                    ${historyTag}
                </div>
            `;
        }

        function closeDetail() {
            currentDetailId = null;
            document.body.classList.remove('no-scroll');
            const overlay = document.getElementById('detail-overlay');
            const card = document.getElementById('detail-card');
            card.classList.replace('scale-100', 'scale-95');
            setTimeout(() => overlay.classList.remove('open'), 200);
        }

        // ================= 核心过滤引擎 =================
        function renderData() {
            let baseData = products.filter(p => (p.week || 'this') === currentWeek);
            
            if(searchQuery) {
                baseData = baseData.filter(p => 
                    p.name.toLowerCase().includes(searchQuery) || 
                    (p.name_sv && p.name_sv.toLowerCase().includes(searchQuery))
                );
            }
            
            let availableStores = new Set(baseData.map(p => p.store));
            selectedStores.forEach(s => { if(!availableStores.has(s)) selectedStores.delete(s); });
            const active = "px-3 py-1 bg-[#8A151B] text-white text-[11px] font-bold rounded-full flex-shrink-0 shadow-sm transition-colors";
            const inactive = "px-3 py-1 bg-white text-gray-600 border border-gray-200 text-[11px] font-medium rounded-full flex-shrink-0 shadow-sm transition-colors";
            document.getElementById('filter-all').className = selectedStores.size === 0 ? active : inactive;
            STORES.forEach(s => {
                const btn = document.getElementById(`filter-${s}`);
                if(btn) btn.className = !availableStores.has(s) ? "px-3 py-1 bg-gray-100 text-gray-300 border border-transparent text-[11px] font-medium rounded-full flex-shrink-0 pointer-events-none" : (selectedStores.has(s) ? active : inactive);
            });

            // 渲染二级分店筛选栏
            renderSubStoreFilters(baseData);

            // 1. 特别关心展示逻辑 (主页，永久展示区域)
            const favSection = document.getElementById('home-fav-section');
            if(!searchQuery) {
                favSection.classList.remove('hidden');
                const homeFav = baseData.filter(p => favoriteItems.has(p.id));
                if(homeFav.length > 0) {
                    document.getElementById('home-fav-container').innerHTML = homeFav.map(p => createCardHTML(p)).join('');
                } else {
                    document.getElementById('home-fav-container').innerHTML = `<div class="col-span-2 text-center text-gray-400 text-[12px] py-6 bg-white rounded-xl border border-gray-100">暂无特别关心商品</div>`;
                }
            } else {
                favSection.classList.add('hidden');
            }

            // 2. 精选逻辑
            const homeFeatured = baseData.filter(p => {
                if(!featuredStores.has(p.store)) return false;
                let val = parseInt((p.discount||"").replace(/[^\d]/g, ''));
                return !isNaN(val) && val >= featuredThreshold; 
            });
            const homeContainer = document.getElementById('home-products-container');
            const homeEmpty = document.getElementById('home-empty-state');
            if(homeFeatured.length === 0) {
                homeContainer.innerHTML = '';
                homeEmpty.classList.remove('hidden');
            } else {
                homeEmpty.classList.add('hidden');
                homeContainer.innerHTML = homeFeatured.slice(0, 4).map(p => createCardHTML(p)).join('');
            }

            // 3. 全量页过滤 (一级品牌 + 二级分店双重过滤)
            let filtered = selectedStores.size > 0 ? baseData.filter(p => selectedStores.has(p.store)) : baseData;
            if (selectedBranches.size > 0) {
                filtered = filtered.filter(p => selectedBranches.has(p.branch));
            }

            if (currentCategory === '特别关心') {
                filtered = filtered.filter(p => favoriteItems.has(p.id));
            } else if (currentCategory === '精选') {
                filtered = filtered.filter(p => {
                    let val = parseInt((p.discount||"").replace(/[^\d]/g, ''));
                    return !isNaN(val) && val >= featuredThreshold;
                });
            } else if (currentCategory !== '全部') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }

            if (currentSort === 'price') {
                filtered.sort((a, b) => sortOrder === 'asc' ? a.currentPrice - b.currentPrice : b.currentPrice - a.currentPrice);
            } else if (currentSort === 'discount') {
                filtered.sort((a, b) => {
                    let numA = parseInt((a.discount||"").replace(/[^\d]/g, '')) || 0;
                    let numB = parseInt((b.discount||"").replace(/[^\d]/g, '')) || 0;
                    return sortOrder === 'desc' ? numB - numA : numA - numB; 
                });
            }

            const allContainer = document.getElementById('all-products-container');
            const allEmpty = document.getElementById('empty-state');
            if (filtered.length === 0) {
                allContainer.innerHTML = '';
                allEmpty.classList.remove('hidden');
            } else {
                allEmpty.classList.add('hidden');
                allContainer.innerHTML = filtered.map(p => createCardHTML(p)).join('');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
