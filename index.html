<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uppsala Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 flex justify-center">

    <!-- Mobile Wrapper -->
    <div class="w-full max-w-md bg-[#F4F1EA] min-h-screen relative shadow-2xl overflow-hidden flex flex-col pb-24">

        <!-- ================= HOME VIEW ================= -->
        <div id="home-view" class="block flex-1 overflow-y-auto">
            
            <header class="bg-[#8A151B] text-white pt-10 pb-3 px-4 sticky top-0 z-50 shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <h1 class="text-[17px] font-black tracking-tight font-sans">UPPSALA DEALS</h1>
                    <div class="flex bg-black/20 rounded-full p-0.5 text-[10px]">
                        <button class="px-2 py-1 bg-white text-[#8A151B] rounded-full font-bold shadow-sm">本周</button>
                        <button class="px-2 py-1 text-white/80 rounded-full font-medium">下周</button>
                    </div>
                </div>
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" placeholder="搜索商品..." class="block w-full pl-9 pr-3 py-1.5 border border-transparent rounded-full leading-5 bg-white/10 text-white placeholder-white/70 focus:outline-none focus:bg-white focus:text-gray-900 text-[13px] transition-colors">
                </div>
            </header>

            <main class="px-4 mt-4 space-y-5">
                <!-- 本周周报 -->
                <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                    <h2 class="text-base font-black text-gray-900 mb-3 tracking-wide">本周周报</h2>
                    <div class="space-y-3 text-[13px] leading-snug text-gray-600">
                        <div><span class="font-black text-[#B8860B] block mb-0.5">特别关心监测</span>您关注的 Garant 牛绞肉本周在 Hemköp 降至 89 kr/kg，触及 30 天史低。</div>
                        <div class="h-px bg-gray-100 w-full"></div>
                        <div><span class="font-black text-[#B8860B] block mb-0.5">全城品类走势</span>受秋收季清库存影响，本地根茎类蔬菜价格大幅跳水，Willys 网袋装为全城最低。</div>
                    </div>
                </section>

                <!-- 超市画报 -->
                <section>
                    <div class="grid grid-cols-4 gap-2">
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] tracking-wider border border-gray-100">ICA</div>
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] tracking-wider border border-gray-100">HEMKÖP</div>
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] tracking-wider border border-gray-100">WILLYS</div>
                        <div class="h-10 bg-white rounded-lg flex items-center justify-center shadow-sm font-black text-gray-800 text-[11px] tracking-wider border border-gray-100">LIDL</div>
                    </div>
                </section>

                <!-- 动态抓取的精选折扣 -->
                <section>
                    <div class="flex justify-between items-end mb-3">
                        <h2 class="text-[15px] font-black text-gray-900 tracking-wide">精选超值折扣</h2>
                        <div class="flex bg-gray-200 rounded-full p-0.5 text-[9px]">
                            <button class="px-2 py-1 bg-white text-gray-900 rounded-full font-bold shadow-sm">离我最近</button>
                            <button class="px-2 py-1 text-gray-500 rounded-full font-medium">3km内</button>
                        </div>
                    </div>
